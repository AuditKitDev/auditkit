[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditkit"
version = "2.0.0"
description = "Python client for the AuditKit tamper-evident audit log API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sign = ["cryptography>=41"]
test = ["pytest>=7", "cryptography>=41"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
