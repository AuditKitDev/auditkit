[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditkit-sdk"
version = "2.0.0a0"
description = "Python client for the AuditKit tamper-evident audit log API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = []

[project.urls]
Homepage = "https://github.com/AuditKitDev/auditkit"
Repository = "https://github.com/AuditKitDev/auditkit"

[project.optional-dependencies]
sign = ["cryptography>=41"]
test = ["pytest>=7", "cryptography>=41"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditkit_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
