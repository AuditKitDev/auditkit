# /etc/nginx/sites-available/auditkit.dev  (new file; symlink into sites-enabled). Does not touch any other site.
# certbot --nginx -d auditkit.dev -d www.auditkit.dev -d api.auditkit.dev   (adds the TLS blocks)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name auditkit.dev www.auditkit.dev api.auditkit.dev;
    root /var/www/auditkit;             # static Astro build (packages/web/dist)
    index index.html;

    # API, auth, app, demo, viewer, public, MCP, well-known -> the container
    location ~ ^/(v1|auth|oauth|api|demo|public|webhooks|mcp|openapi\.json|health|\.well-known/) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 8m;
    }

    # Dashboard pages are static with a placeholder id segment; the island reads the real id from the URL.
    location ~ ^/app/projects/(?!_(/|$))[^/]+(/.*)?$ {
        rewrite ^/app/projects/[^/]+(/.*)?$ /app/projects/_$1 last;
    }
    # Static site; Astro emits /path/index.html
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "public, max-age=300";
    }
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
